<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Carpe Diem Matrics</title>

<!-- ============================= -->
<!-- CARPE DIEM PWA CONFIGURATION -->
<!-- ============================= -->

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#111827">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carpe Diem">

<link rel="apple-touch-icon" href="./icons/icon-192.png">

<!-- ============================= -->
<!-- STYLES -->
<!-- ============================= -->

<style>

:root{
color-scheme:light dark;
--bg:#101827;
--panel:#18243a;
--panel2:#20304a;
--text:#f4f7fb;
--muted:#aebbd0;
--accent:#55d6be;
--gold:#f4c95d;
--red:#ff7b72;
--line:#30435f
}

*{
box-sizing:border-box
}

body{
margin:0;
font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
background:var(--bg);
color:var(--text)
}

button,input{
font:inherit
}

.app{
min-height:100vh;
background-color:#101827;
background:linear-gradient(135deg,#0d1728,#172a3d 55%,#122b2d)
}

header{
padding:28px 6vw 18px;
border-bottom:1px solid #ffffff16;
position:sticky;
top:0;
background:#101827eF;
backdrop-filter:blur(14px);
z-index:5
}

.brand{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px
}

.brand h1{
margin:0;
font-family:Georgia,serif;
font-size:clamp(28px,5vw,48px);
letter-spacing:-1px
}

.brand h1 span{
color:var(--gold)
}

.tag{
color:var(--muted);
margin:6px 0 0
}

.nav{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:20px
}

.nav button,
.btn{
border:1px solid var(--line);
background:#ffffff08;
color:var(--text);
padding:10px 15px;
border-radius:12px;
cursor:pointer
}

.nav button:hover,
.btn:hover{
transform:translateY(-1px)
}

.nav button.active,
.btn.primary{
background:var(--accent);
color:#08231f;
border-color:var(--accent);
font-weight:800
}

.page{
max-width:1200px;
margin:auto;
padding:34px 6vw 70px
}

.hero{
display:grid;
grid-template-columns:1.35fr .65fr;
gap:22px;
align-items:stretch
}

.card{
background:linear-gradient(145deg,#ffffff0b,#ffffff04);
border:1px solid #ffffff12;
border-radius:22px;
padding:26px;
box-shadow:0 18px 50px #0003
}

.hero h2{
font:700 clamp(38px,7vw,70px)/.95 Georgia,serif;
margin:0 0 18px
}

.hero h2 em{
color:var(--gold);
font-style:normal
}

.hero p{
font-size:18px;
line-height:1.6;
color:var(--muted);
max-width:680px
}

.quote{
font:italic 25px/1.35 Georgia,serif;
color:#fff
}

.small{
color:var(--muted);
font-size:13px
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
margin-top:20px
}

.feature h3{
margin:5px 0 8px
}

.feature p{
color:var(--muted);
line-height:1.5
}

.timer{
text-align:center
}

.timer-display{
font-size:72px;
font-weight:800;
letter-spacing:2px;
margin:20px 0
}

.timer-mode{
color:var(--accent);
font-weight:800;
text-transform:uppercase;
letter-spacing:2px
}

.timer-controls{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap
}

.settings{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
margin:18px 0
}

.settings input{
width:90px;
background:#101827;
color:var(--text);
border:1px solid var(--line);
padding:9px;
border-radius:10px
}

.section-title{
font:700 38px Georgia,serif;
margin:0 0 10px
}

.portal{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px
}

.quote-list{
display:grid;
gap:12px
}

.quote-item{
padding:18px;
border-radius:16px;
background:#ffffff08;
border-left:3px solid var(--gold)
}

.quote-item button{
margin-top:10px
}

.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:9px;
margin-top:20px
}

.day{
min-height:125px;
padding:10px;
border:1px solid var(--line);
border-radius:14px;
background:#ffffff06;
cursor:pointer
}

.day.locked{
opacity:.55
}

.day strong{
display:block;
color:var(--gold);
margin-bottom:8px
}

.day textarea{
width:100%;
height:70px;
resize:none;
background:transparent;
border:0;
color:var(--text);
outline:0;
font-size:13px
}

.editbar{
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap
}

.hidden{
display:none
}

.toast{
position:fixed;
right:20px;
bottom:20px;
background:#21344c;
padding:13px 17px;
border-radius:12px;
border:1px solid var(--line);
display:none;
z-index:100
}

.footer{
text-align:center;
color:var(--muted);
margin-top:35px;
font-size:13px
}

.install-note{
margin-top:15px;
padding:12px;
border-radius:12px;
background:#55d6be12;
border:1px solid #55d6be33;
color:var(--muted);
font-size:13px
}

@media(max-width:800px){

.hero,
.portal,
.grid{
grid-template-columns:1fr
}

.calendar{
grid-template-columns:repeat(2,1fr)
}

.day{
min-height:110px
}

.brand{
align-items:flex-start;
flex-direction:column
}

.nav button{
flex:1 1 auto
}

.timer-display{
font-size:56px
}

}

</style>
</head>

<body>

<div class="brand">

<div>

</p>

</div>

</div>

</div>

<nav class="nav">

<button data-page="study">

</button>

</button>

</nav>

</header>
